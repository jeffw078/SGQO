<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Pesquisa de Satisfação</title><link rel="icon" href="../assets/img/favicon.png"><link rel="stylesheet" href="../assets/css/style.css">
    <style>body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#12345b,#071525 65%)}.survey{width:min(760px,100%);background:#0d2038;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:34px;box-shadow:0 25px 70px rgba(0,0,0,.4)}.survey-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:1px solid rgba(255,255,255,.09);padding-bottom:22px}.logo{width:110px}.iso-tag{padding:7px 10px;border-radius:30px;background:rgba(15,117,189,.16);color:#93c5fd;font-size:.72rem;font-weight:700}.survey h1{color:#fff;font-size:1.7rem;margin:24px 0 7px}.survey p{color:rgba(255,255,255,.62);line-height:1.6}.survey-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:.76rem;color:rgba(255,255,255,.45);margin-top:12px}.identity{margin-top:22px;padding:16px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}.identity span{display:block;color:rgba(255,255,255,.45);font-size:.72rem;margin-bottom:4px}.identity strong{color:#dbeafe}.field{margin-top:24px;padding-top:22px;border-top:1px solid rgba(255,255,255,.07)}.field>label{display:block;color:#dbeafe;font-weight:600;margin-bottom:12px;line-height:1.45}.required-mark{color:#fca5a5}.scores{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}.scores label,.rating label{margin:0}.scores input,.rating input{position:absolute;opacity:0}.scores span{display:grid;place-items:center;aspect-ratio:1;border-radius:8px;background:rgba(255,255,255,.07);color:#fff;cursor:pointer;border:1px solid transparent}.scores input:focus+span,.rating input:focus+span{outline:2px solid #60a5fa}.scores input:checked+span,.rating input:checked+span{background:#0f75bd;border-color:#60a5fa}.score-legend{display:flex;justify-content:space-between;color:rgba(255,255,255,.42);font-size:.68rem;margin-top:7px}.rating{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.rating span{display:flex;min-height:52px;padding:8px;align-items:center;justify-content:center;text-align:center;border-radius:8px;background:rgba(255,255,255,.07);color:#dbeafe;cursor:pointer;font-size:.74rem}.survey select,.survey textarea,.lead-modal input[type="email"]{width:100%;padding:12px;border-radius:9px;border:1px solid rgba(255,255,255,.12);background:#122b48;color:#fff}.consent{display:flex;align-items:flex-start;gap:8px;font-size:.75rem;color:rgba(255,255,255,.62);margin-top:12px}.consent input{margin-top:3px}.privacy{margin-top:24px;padding:12px;border-radius:9px;background:rgba(255,255,255,.04);font-size:.72rem!important}.submit{margin-top:18px;width:100%;padding:14px;border:0;border-radius:9px;background:#0f75bd;color:white;font-weight:700;cursor:pointer}.submit:hover{background:#1688d4}.lead-overlay{position:fixed;inset:0;z-index:1000;display:none;place-items:center;padding:20px;background:rgba(2,8,18,.78);backdrop-filter:blur(5px)}.lead-overlay.active{display:grid}.lead-modal{width:min(480px,100%);padding:26px;border-radius:16px;background:#0d2038;border:1px solid rgba(255,255,255,.12);box-shadow:0 25px 70px rgba(0,0,0,.5)}.lead-modal h2{color:#fff;margin:0 0 8px}.lead-modal p{color:rgba(255,255,255,.6);line-height:1.5}.lead-actions{display:flex;gap:9px;margin-top:18px}.lead-actions button{flex:1;padding:11px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:transparent;color:#dbeafe;cursor:pointer}.lead-actions .primary{border:0;background:#0f75bd;color:#fff;font-weight:700}@media(max-width:600px){.scores{grid-template-columns:repeat(6,1fr)}.rating{grid-template-columns:1fr}.survey{padding:22px}.survey-head{align-items:center}}</style>
</head>
<body><main class="survey"><div class="survey-head"><img class="logo" src="../assets/img/logo.png" alt="SGQ Online"><span class="iso-tag">SATISFAÇÃO DO CLIENTE · ISO 9001</span></div><div id="content"></div></main><div class="lead-overlay" id="leadModal"><div class="lead-modal"><h2>Quer conhecer o SGQ Online?</h2><p>Deixe seu e-mail para que nossa equipe apresente a plataforma. Este contato é opcional.</p><form onsubmit="saveInterest(event)"><input id="interestEmail" type="email" placeholder="seuemail@empresa.com.br" required><label class="consent"><input id="contactConsent" type="checkbox" required> Autorizo o contato do SGQ Online sobre produtos e serviços.</label><div class="lead-actions"><button type="button" onclick="closeLeadModal()">Agora não</button><button class="primary" type="submit">Quero conhecer</button></div></form></div></div>
<script src="../assets/js/sgq-core.js"></script>
<script>
const token = new URLSearchParams(location.search).get('token');
const surveys = SGQCore.read('sgq_satisfaction_surveys', []);
const DEFAULT_QUESTIONS = [
 {id:'nps',text:'Em uma escala de 0 a 10, qual a probabilidade de recomendar nossa empresa a um colega ou parceiro?',type:'nps',required:true},
 {id:'quality',text:'Como você avalia a qualidade do produto ou serviço entregue?',type:'scale5',required:true},
 {id:'requirements',text:'O produto ou serviço atendeu aos requisitos e especificações combinados?',type:'scale5',required:true},
 {id:'delivery',text:'Como você avalia o cumprimento dos prazos acordados?',type:'scale5',required:true},
 {id:'service',text:'Como você avalia nosso atendimento e a clareza da comunicação?',type:'scale5',required:true},
 {id:'problem',text:'Quando houve dúvida ou problema, nossa equipe resolveu de forma satisfatória?',type:'scale5',required:false},
 {id:'reuse',text:'Você voltaria a contratar ou comprar de nossa empresa?',type:'yesno',required:true},
 {id:'reason',text:'Qual é o principal motivo da sua nota?',type:'text',required:true},
 {id:'improvement',text:'O que poderíamos melhorar em nossos produtos, serviços ou atendimento?',type:'text',required:false}
];
const template = SGQCore.read('sgq_satisfaction_template', {questions:DEFAULT_QUESTIONS});
let survey = surveys.find(item => item.token === token);
if (!token) survey = {id:`public_${Date.now()}`,client:'Metalúrgica Alpha Ltda',questions:template.questions?.length ? template.questions : DEFAULT_QUESTIONS,status:'ativa',publicModel:true,expiresAt:new Date(Date.now()+(Number(template.expiryDays)||7)*86400000).toISOString()};
function message(title,text){content.innerHTML=`<h1>${title}</h1><p>${text}</p>`;}
function esc(value){const element=document.createElement('span');element.textContent=String(value||'');return element.innerHTML;}
function formatDeadline(value){return new Date(value).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});}
function renderQuestion(question,index){
 const required=question.required?'required':'';const name=`q_${question.id||index}`;
 const label=`${index+1}. ${esc(question.text)} ${question.required?'<span class="required-mark">*</span>':''}`;
 if(question.type==='nps')return `<div class="field"><label>${label}</label><div class="scores">${Array.from({length:11},(_,i)=>`<label><input type="radio" name="${name}" value="${i}" ${required}><span>${i}</span></label>`).join('')}</div><div class="score-legend"><span>0 · Nada provável</span><span>10 · Extremamente provável</span></div></div>`;
 if(question.type==='scale5'){const options=[[1,'Muito insatisfeito'],[2,'Insatisfeito'],[3,'Regular'],[4,'Satisfeito'],[5,'Muito satisfeito']];return `<div class="field"><label>${label}</label><div class="rating">${options.map(([value,text])=>`<label><input type="radio" name="${name}" value="${value}" ${required}><span>${value} · ${text}</span></label>`).join('')}</div></div>`;}
 if(question.type==='yesno')return `<div class="field"><label>${label}</label><select name="${name}" ${required}><option value="">Selecione</option><option value="Sim">Sim</option><option value="Não">Não</option></select></div>`;
 return `<div class="field"><label>${label}</label><textarea name="${name}" rows="4" placeholder="Escreva sua resposta..." ${required}></textarea></div>`;
}
if(!survey) message('Pesquisa não encontrada','Confira o link recebido ou solicite uma nova pesquisa.');
else if(survey.status==='respondida') message('Resposta já registrada','Obrigado por participar. Este link aceita apenas uma resposta.');
else if(new Date(survey.expiresAt)<new Date()) message('Pesquisa encerrada','O prazo desta pesquisa terminou. Obrigado pelo interesse.');
else {
 const questions=survey.questions?.length?survey.questions:DEFAULT_QUESTIONS;
 content.innerHTML=`<h1>Pesquisa de satisfação</h1><p>Queremos entender sua experiência e usar sua opinião para melhorar nossos produtos, serviços e processos.</p><div class="survey-meta"><span>Leva aproximadamente 3 minutos</span><span>* Campos obrigatórios</span><span><strong>Pesquisa disponível até: ${formatDeadline(survey.expiresAt)}</strong></span></div><div class="identity"><span>Pesquisa destinada a</span><strong>${esc(survey.client)}</strong></div><form onsubmit="submitSurvey(event)">${questions.map(renderQuestion).join('')}<p class="privacy">As respostas serão usadas exclusivamente para análise da satisfação, melhoria contínua e atendimento aos requisitos do sistema de gestão da qualidade.</p><button class="submit">Enviar avaliação</button></form>`;
}
function submitSurvey(event){
 event.preventDefault();const formData=new FormData(event.target);const respondentName=survey.client;const questions=survey.questions?.length?survey.questions:DEFAULT_QUESTIONS;const answers={};questions.forEach((question,index)=>answers[question.id||index]=formData.get(`q_${question.id||index}`));
 const npsQuestion=questions.find(question=>question.type==='nps');const score=npsQuestion?Number(answers[npsQuestion.id]):null;const comments=questions.filter(question=>question.type==='text').map(question=>answers[question.id]).filter(Boolean).join(' | ');
 const db=SGQCore.read('sgq_satisfacao',{clientes:[],reclamacoes:[],npsRespostas:[],pesquisaRespostas:[]});db.pesquisaRespostas=db.pesquisaRespostas||[];db.pesquisaRespostas.push({id:SGQCore.nextId(db.pesquisaRespostas),cliente:survey.client,respondente:respondentName,pesquisaId:survey.id,respostas:answers,data:new Date().toISOString()});
 if(npsQuestion&&Number.isFinite(score)){db.npsRespostas=db.npsRespostas||[];db.npsRespostas.push({id:SGQCore.nextId(db.npsRespostas),cliente:survey.client||respondentName,respondente:respondentName,nota:score,comentario:comments,data:new Date().toISOString().slice(0,10),pesquisaId:survey.id});}
 SGQCore.write('sgq_satisfacao',db);survey.status='respondida';survey.respondedAt=new Date().toISOString();survey.resposta=answers;if(!survey.publicModel)SGQCore.write('sgq_satisfaction_surveys',surveys);message('Obrigado pela resposta','Sua avaliação foi registrada com sucesso e será considerada em nossas ações de melhoria.');document.getElementById('leadModal').classList.add('active');
}
function closeLeadModal(){document.getElementById('leadModal').classList.remove('active');}
function saveInterest(event){event.preventDefault();const leads=SGQCore.read('sgq_commercial_leads',[]);leads.push({id:SGQCore.nextId(leads),nome:survey.client,email:document.getElementById('interestEmail').value.trim(),origem:'Pesquisa de satisfação',consentimentoEm:new Date().toISOString(),status:'novo'});SGQCore.write('sgq_commercial_leads',leads);closeLeadModal();message('Obrigado pelo interesse','Sua avaliação foi registrada e nossa equipe poderá entrar em contato pelo e-mail informado.');}
</script></body></html>
